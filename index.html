line);overflow:hidden}.art img{width:100%;height:100%;object-fit:contain;display:block;padding:14px}.art .indicator{position:absolute;top:14px;right:14px;background:#fff;color:transparent;box-shadow:0 2px 8px #0002}.selected .art .indicator{background:var(--green);color:white}.design-body{padding:18px;min-width:0}.design-body .num{font-size:11px;font-weight:850;letter-spacing:1.6px;color:var(--muted)}.design-body b{font-size:19px;margin-top:8px;line-height:1.22;overflow-wrap:anywhere}.design-body small{font-size:13px;overflow-wrap:anywhere}.foot{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:auto;padding-top:16px}.btn{border:0;border-radius:17px;padding:17px 22px;min-height:58px;font-size:16px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:10px}.primary{background:var(--green);color:white}.primary:not(:disabled):hover{background:#246049}.secondary{background:#e8eee7;color:var(--green)}.ghost{background:white;border:1px solid var(--line);color:var(--green)}.foot .primary{min-width:180px}.trust{font-size:13px;color:var(--muted)}.message-wrap{width:100%;display:grid;place-items:center;padding:24px}.message{background:white;border:1px solid var(--line);border-radius:30px;padding:clamp(26px,5vw,64px);max-width:650px;width:100%;box-shadow:0 20px 80px #19382d0b}.message h1{font-size:clamp(30px,4vw,49px);letter-spacing:-1.2px;line-height:1.12;margin:16px 0}.message p{color:var(--muted);font-size:17px;line-height:1.6}.message .btn{margin-top:18px}.message-icon{width:64px;height:64px;display:grid;place-items:center;border-radius:19px;background:#e8f0e8;color:var(--green);font-size:36px}.alert{background:#fff4e9;border:1px solid #e6bd84;padding:14px 17px;color:#744612;border-radius:14px;font-size:15px;line-height:1.5}.notice{background:#eaf3ec;border:1px solid #c4dacc;padding:12px 15px;border-radius:12px;color:#20563d}.admin{width:min(1200px,100%);margin:0 auto;padding:clamp(20px,4vw,50px);flex:1}.admin-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap;margin-bottom:25px}.admin h1{font-size:clamp(29px,4vw,45px);letter-spacing:-1px;margin:5px 0 6px}.admin p{color:var(--muted);line-height:1.55}.admin-head p{margin:0}.admin-actions{display:flex;flex-wrap:wrap;gap:10px}.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.tabs .btn{min-height:50px;padding:12px 18px}.tabs .active{background:var(--green);color:white}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,32px);margin-bottom:18px}.panel h2{font-size:25px}.panel h3{margin:0 0 10px;font-size:20px}.status{display:inline-block;border-radius:30px;padding:8px 13px;font-size:13px;font-weight:800;background:#edf1ec;color:#476051}.status.live{background:#def0e2;color:#23603c}.status.off{background:#f9e9d2;color:#7b501c}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.mini-list{display:grid;gap:11px;margin:18px 0}.mini-item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:15px;padding:9px}.mini-item img{width:86px;height:86px;object-fit:contain;background:#e9eee7;border-radius:9px}.mini-item .text{flex:1;min-width:0}.mini-item b{display:block;overflow-wrap:anywhere}.mini-item small{display:block;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.mini-item .btn{min-height:44px;padding:10px 12px}.form{display:grid;gap:13px}.form label{display:grid;gap:7px;font-weight:700;color:var(--ink);font-size:14px}.form input,.form textarea{display:block;width:100%;border:1.5px solid #c7d3c9;border-radius:12px;min-height:50px;padding:12px 13px;background:#fff;color:var(--ink);font-size:16px}.form input[type=file]{font-size:14px;padding:12px}.form textarea{min-height:84px;resize:vertical}.form .btn{justify-self:start}.muted{font-size:14px;color:var(--muted)}.results{display:grid;gap:18px}.result-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin:16px 0}.result-row b{font-size:15px}.result-row span{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}.meter{height:10px;border-radius:20px;background:#ebf0ea;overflow:hidden;margin-top:7px}.meter>span{display:block;height:100%;border-radius:20px;background:var(--green)}.page-bottom{padding:14px 24px;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1020px){.voting{grid-template-columns:1fr;min-height:0}.intro{padding:26px 28px;gap:9px}.intro h1{font-size:35px;margin:8px 0}.intro p{font-size:16px}.intro-foot,.intro .overline{display:none}.question{padding:25px clamp(18px,4vw,35px)}.options.designs{grid-template-columns:repeat(3,minmax(0,1fr))}.art{aspect-ratio:1/1}.design-body{padding:13px}.design-body b{font-size:17px}.design-body small{font-size:12px}.top-hint{display:none}}
@media(max-width:650px){.top{padding:14px 18px}.brandmark{width:39px;height:39px}.intro h1{font-size:31px;letter-spacing:-1px}.intro{padding:22px 20px}.intro p{font-size:15px}.question{gap:18px}.options.designs{grid-template-columns:1fr}.design-choice{display:grid;grid-template-columns:125px 1fr;min-height:140px}.design-choice .art{height:100%;min-height:140px;aspect-ratio:auto;border-bottom:0;border-right:1px solid var(--line)}.design-body{padding:17px 12px;align-self:center}.design-body b{font-size:19px}.design-body small{font-size:13px}.options.basic{gap:10px}.choice.basic-choice{min-height:165px;padding:16px}.choice b{font-size:26px}.foot{flex-wrap:wrap}.foot .btn{flex:1;min-width:0}.trust{width:100%;text-align:center;order:3}.admin-grid{grid-template-columns:1fr}.admin-head{display:block}.admin-actions{margin-top:16px}.mini-item img{width:65px;height:65px}.mini-item .btn{font-size:13px}.message{border-radius:20px}.question-top{gap:8px}}

<body>
<div id="app"><main class="message-wrap"><div class="message"><h1>Waldkirche-Abstimmung</h1><p>Die Anwendung wird gestartet …</p></div></main></div>
<noscript>Bitte JavaScript aktivieren. Die Abstimmung benötigt JavaScript.</noscript>
<script>
'use strict';
(()=>{
  // The publishable key is a browser key. Authorization is enforced by Supabase RLS.
  const BASE='https://wrmwzesptikclqzbzwte.supabase.co';
  const KEY='sb_publishable_bjrysGI6TxcXm1xZVzIxNg_HJiaKTcp';
  const app=document.getElementById('app');
  const state={route:location.hash.startsWith('#/admin')?'admin':'vote',step:0,basic:null,hirte:null,baum:null,ballot:uuid(),done:false,settings:null,designs:[],loading:true,error:'',sendError:'',busy:false,notice:'',adminTab:'designs',session:null,adminReady:false,ballots:[],adminError:'',uploading:false};
  function uuid(){if(typeof crypto!=='undefined'&&crypto.randomUUID)return crypto.randomUUID();const b=new Uint8Array(16);if(typeof crypto!=='undefined'&&crypto.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;return Array.from(b,(v,i)=>v.toString(16).padStart(2,'0')+([3,5,7,9].includes(i)?'-':'')).join('')}
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const els=(v)=>esc(v);
  function imageUrl(path){return BASE+'/storage/v1/object/public/designs/'+String(path||'').split('/').map(encodeURIComponent).join('/')}
  const isAdmin=()=>Boolean(state.session?.access_token&&state.adminReady);
  const formats={2:'Hirte & Schaf',3:'Baum & Wurzeln'};
  function complete(){return [2,3].every(q=>{const count=state.designs.filter(d=>d.question===q).length;return count>=2&&count<=3})}
  function explain(e){const msg=String(e?.message||e||'Unbekannter Fehler');if(/fetch|network|failed to fetch|load failed/i.test(msg))return 'Keine Verbindung zu Supabase. Bitte Internetverbindung prüfen und erneut versuchen.';if(/does not exist|relation .* not found|could not find the table|pgrst205/i.test(msg))return 'Die Supabase-Datenbank ist noch nicht eingerichtet. Bitte zuerst supabase/schema.sql im SQL Editor ausführen.';if(/row-level security|permission denied|42501/i.test(msg))return 'Keine Berechtigung. Bitte die Adminfreigabe und die SQL-Regeln prüfen.';return msg}
  function sessionSave(){try{if(state.session)sessionStorage.setItem('wk_vote_admin',JSON.stringify(state.session));else sessionStorage.removeItem('wk_vote_admin')}catch{}}
  function sessionLoad(){try{const raw=sessionStorage.getItem('wk_vote_admin');if(raw)state.session=JSON.parse(raw)}catch{}}
  async function request(path,{method='GET',body=null,admin=false,contentType='application/json',headers={}}={}){
    if(admin)await ensureSession();
    const h={apikey:KEY,...headers};if(admin&&state.session)h.Authorization='Bearer '+state.session.access_token;if(body!==null&&contentType)h['Content-Type']=contentType;
    const result=await fetch(BASE+path,{method,headers:h,body:body===null?undefined:contentType==='application/json'?JSON.stringify(body):body,cache:'no-store'});
    const raw=await result.text();let value;try{value=raw?JSON.parse(raw):null}catch{value=raw}
    if(!result.ok){const error=new Error(value?.message||value?.error_description||value?.error||('HTTP '+result.status));error.status=result.status;throw error}
    return value;
  }
  async function ensureSession(){if(!state.session?.access_token)throw Error('Bitte erneut anmelden.');if(Date.now()<(state.session.expires_at||0)-60000)return;if(!state.session.refresh_token)throw Error('Sitzung abgelaufen. Bitte erneut anmelden.');const next=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:state.session.refresh_token}});state.session={...next,expires_at:Date.now()+next.expires_in*1000};sessionSave()}
  async function fetchPoll(show=true){if(show){state.loading=true;state.error='';render()}try{const [ss,dd]=await Promise.all([request('/rest/v1/voting_settings?select=*&id=eq.true'),request('/rest/v1/design_options?select=*&order=question.asc,position.asc')]);if(!Array.isArray(ss)||!ss[0])throw Error('Die Abstimmung ist in der Datenbank noch nicht angelegt. Bitte das SQL-Schema ausführen.');state.settings=ss[0];state.designs=dd||[];state.error=''}catch(e){state.error=explain(e)}finally{state.loading=false;render()}}
  function frame(inner,foot=true){return `<div class="shell"><header class="top"><div class="brand"><span class="brandmark" aria-hidden="true">W</span><span>waldkirche.<small>DESIGNABSTIMMUNG</small></span></div><div class="top-hint">GEMEINSAM ENTSCHEIDEN</div></header><main class="main">${inner}</main>${foot?'<footer class="page-bottom">Eine Stimme pro Frage · Auf Vertrauensbasis · Ohne Anmeldung für Gemeindemitglieder</footer>':''}</div>`}
  function message(title,body,action='',label='Erneut versuchen'){return frame(`<div class="message-wrap"><section class="message" role="status"><span class="message-icon" aria-hidden="true">${title==='Danke für deine Stimme!'?'✓':'✳'}</span><h1>${esc(title)}</h1><p>${els(body)}</p>${action?`<button class="btn primary" data-action="${esc(action)}">${esc(label)}</button>`:''}</section></div>`)}
  function progress(){return `<div class="bars" aria-label="Frage ${state.step+1} von 3">${[0,1,2].map(i=>`<span class="${i<=state.step?'on':''}"></span>`).join('')}</div>`}
  function intro(){const blocks=[['DER SCHRIFTZUG','Würdest du den <em>Schriftzug</em> tragen?','Nur ein kleiner „Waldkirche“-Schriftzug vorne – kein Shirt wird hier zum Kauf angeboten. Es geht um deine Meinung zur Idee.'],['HIRTE & SCHAF','Welches Motiv <em>spricht dich an?</em>','Drei gleichberechtigte Entwürfe: Entscheide dich für das Motiv, das dir persönlich am besten gefällt.'],['BAUM & WURZELN','Welche Idee <em>gefällt dir?</em>','Zum Abschluss wählst du deinen Favoriten aus den Baum- und Wurzelmotiven.']];const [tag,title,desc]=blocks[state.step];return `<aside class="intro"><div><div class="overline">${tag} · FRAGE 0${state.step+1} / 03</div><h1>${title}</h1><p>${desc}</p></div><div class="intro-foot">Waldkirche · Gemeinsam gestalten</div></aside>`}
  function designChoice(d,i,selected){return `<button type="button" class="choice design-choice ${selected?'selected':''}" role="radio" aria-checked="${selected}" data-action="choose" data-id="${esc(d.id)}"><div class="art"><img src="${esc(imageUrl(d.image_path))}" alt="${esc(d.title)}" loading="eager"><span class="indicator" aria-hidden="true">✓</span></div><div class="design-body"><span class="num">ENTWURF ${i+1}</span><b>${els(d.title)}</b>${d.description?`<small>${els(d.description)}</small>`:''}</div></button>`}
  function vote(){if(state.loading)return message('Abstimmung wird geladen','Die Verbindung zur Datenbank wird hergestellt.');if(state.error)return message('Verbindung nicht möglich',state.error,'retry');if(!state.settings?.is_open||!complete())return message('Die Abstimmung ist noch nicht geöffnet','Das Merch-Team bereitet die Entwürfe vor. Bitte später erneut vorbeischauen.','retry','Erneut prüfen');if(state.done)return message('Danke für deine Stimme!','Deine drei Antworten wurden gespeichert. Für die nächste Person kannst du jetzt einen neuen, leeren Stimmzettel öffnen.','restart','Neue Abstimmung starten');
    const q=state.step+1;const picked=state.step===0?state.basic!==null:state.step===1?Boolean(state.hirte):Boolean(state.baum);const items=state.designs.filter(d=>d.question===q);const selected=state.step===1?state.hirte:state.baum;
    const options=state.step===0?`<div class="wordmark-preview">waldkirche<span style="color:#9eaa83">.</span></div><span class="wordmark-label">Nur die Schriftzug-Idee, kein fertiges Kleidungsstück</span><div class="options basic" role="radiogroup" aria-label="Würdest du den Schriftzug tragen oder kaufen?">${[[true,'Ja','Kann ich mir vorstellen.'],[false,'Nein','Würde ich eher nicht tragen.']].map(([v,label,desc])=>`<button type="button" class="choice basic-choice ${state.basic===v?'selected':''}" role="radio" aria-checked="${state.basic===v}" data-action="basic" data-value="${v}"><span class="indicator" aria-hidden="true">✓</span><span><b>${label}</b><small>${desc}</small></span></button>`).join('')}</div>`:`<div class="options designs" role="radiogroup" aria-label="Motiv wählen">${items.map((d,i)=>designChoice(d,i,selected===d.id)).join('')}</div>`;
    return frame(`<div class="voting">${intro()}<section class="question"><div class="question-top"><span class="step">FRAGE ${q} VON 3</span>${progress()}</div><div><h2>${state.step===0?'Deine Meinung zum Basic':`Dein Favorit: ${formats[q]}`}</h2><p class="sub">Bitte wähle genau eine Antwort aus.</p></div>${options}${state.sendError?`<p class="alert" role="alert">${els(state.sendError)} Deine Auswahl bleibt erhalten.</p>`:''}<div class="foot">${state.step?'<button class="btn secondary" data-action="back">← Zurück</button>':'<span class="trust">Ohne Registrierung · Eine Stimme pro Frage</span>'}<button class="btn primary" data-action="next" ${!picked||state.busy?'disabled':''}>${state.busy?'Wird gespeichert …':state.step===2?'Stimme abgeben ✓':'Weiter →'}</button></div></section></div>`)}
  function adminLayout(content){return frame(`<div class="admin"><div class="admin-head"><div><span class="step">WALDKIRCHE / TEAM</span><h1>Abstimmung verwalten</h1><p>Designideen einpflegen, Stimmen ansehen und Abstimmung steuern.</p></div><div class="admin-actions"><button class="btn ghost" data-action="go-vote">← Zur Abstimmung</button>${isAdmin()?'<button class="btn ghost" data-action="logout">Abmelden</button>':''}</div></div>${content}</div>`)}
  function login(){return adminLayout(`<section class="panel" style="max-width:540px"><h2>Team-Anmeldung</h2><p>Nur für das freigeschaltete Merch-Team. Gemeindemitglieder benötigen keinen Zugang.</p>${state.adminError?`<p class="alert" role="alert">${els(state.adminError)}</p>`:''}<form id="loginForm" class="form"><label>E-Mail-Adresse<input type="email" name="email" autocomplete="username" required></label><label>Passwort<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" ${state.busy?'disabled':''}>${state.busy?'Anmeldung läuft …':'Anmelden'}</button></form></section>`)}
  function adminTabs(){return `<div class="tabs" role="group" aria-label="Verwaltung"><button class="btn ${state.adminTab==='designs'?'active':'secondary'}" data-action="tab" data-value="designs">Designs & Freigabe</button><button class="btn ${state.adminTab==='results'?'active':'secondary'}" data-action="tab" data-value="results">Ergebnisse</button></div>`}
  function count(q){return state.designs.filter(d=>d.question===q).length}
  function editor(q){const ds=state.designs.filter(d=>d.question===q);const editable=!state.settings?.is_open&&!state.ballots.length;return `<section class="panel"><h2>${formats[q]}</h2><p>${ds.length} von 2–3 erforderlichen Motiven vorhanden.</p><div class="mini-list">${ds.map((d,i)=>`<div class="mini-item"><img src="${esc(imageUrl(d.image_path))}" alt="${esc(d.title)}"><div class="text"><b>${els(d.title)}</b><small>Entwurf ${i+1}${d.description?' · '+els(d.description):''}</small></div>${editable?`<button class="btn ghost" data-action="delete" data-id="${esc(d.id)}">Entfernen</button>`:''}</div>`).join('')}</div>${editable&&ds.length<3?`<form class="form upload-form" data-question="${q}"><h3>Design hinzufügen</h3><label>Motivbild (PNG, JPEG oder WebP, max. 8 MB)<input type="file" name="image" accept="image/png,image/jpeg,image/webp" required></label><label>Titel<input type="text" name="title" minlength="1" maxlength="80" placeholder="z. B. Behütet" required></label><label>Beschreibung (optional)<textarea name="description" maxlength="300" placeholder="Kurze Beschreibung der Motividee"></textarea></label><button class="btn primary" type="submit" ${state.busy?'disabled':''}>Motiv speichern</button></form>`:editable?'<p class="muted">Alle drei möglichen Motive sind angelegt.</p>':'<p class="muted">Bei geöffneter Abstimmung oder vorhandenen Stimmen sind Motive gesperrt.</p>'}</section>`}
  function settingsEditor(){return `<section class="panel"><div class="settings-row"><div><span class="status ${state.settings?.is_open?'live':'off'}">${state.settings?.is_open?'● Abstimmung geöffnet':'○ Abstimmung geschlossen'}</span><p>${state.settings?.is_open?'Gemeindemitglieder können jetzt abstimmen.':'Vor dem Öffnen sind pro Motivgruppe mindestens zwei Entwürfe erforderlich.'}</p></div><button class="btn ${state.settings?.is_open?'secondary':'primary'}" data-action="toggle" ${state.busy||(!state.settings?.is_open&&!complete())?'disabled':''}>${state.settings?.is_open?'Abstimmung schließen':'Abstimmung öffnen'}</button></div></section>`}
  function calcResults(){const out=[];const n=state.ballots.length;out.push({question:'Basic-Schriftzug',rows:[['Ja',state.ballots.filter(b=>b.basic_yes===true).length],['Nein',state.ballots.filter(b=>b.basic_yes===false).length]]});for(const q of [2,3]){const field=q===2?'pastoral_option':'tree_option';out.push({question:formats[q],rows:state.designs.filter(d=>d.question===q).map(d=>[d.title,state.ballots.filter(b=>b[field]===d.id).length])})}return {n,out}}
  function results(){const {n,out}=calcResults();return `<section class="panel"><h2>Ergebnisse</h2><p>${n} abgegebene Stimmzettel. Jeder Stimmzettel enthält je eine Antwort auf alle drei Fragen.</p><button class="btn secondary" data-action="refresh-results" ${state.busy?'disabled':''}>Ergebnisse aktualisieren</button> <button class="btn primary" data-action="csv" ${!n?'disabled':''}>Ergebnisse als CSV</button></section><div class="results">${out.map(group=>`<section class="panel"><h3>${els(group.question)}</h3>${group.rows.map(([title,v])=>`<div class="result-row"><div><b>${els(title)}</b><div class="meter"><span style="width:${n?Math.min(100,(v/n)*100):0}%"></span></div></div><span>${v} · ${n?Math.round(v/n*100):0} %</span></div>`).join('')}</section>`).join('')}</div>`}
  function admin(){if(!state.session?.access_token||!state.adminReady)return login();if(state.loading)return adminLayout('<section class="panel"><p>Teamdaten werden geladen …</p></section>');return adminLayout(`${state.adminError?`<p class="alert" role="alert">${els(state.adminError)}</p>`:''}${state.notice?`<p class="notice" role="status">${els(state.notice)}</p>`:''}${adminTabs()}${state.adminTab==='results'?results():settingsEditor()+`<div class="admin-grid">${editor(2)}${editor(3)}</div>`}`)}
  function render(){try{app.innerHTML=state.route==='admin'?admin():vote()}catch(e){app.innerHTML=`<main class="message-wrap"><section class="message"><h1>Die Seite konnte nicht angezeigt werden.</h1><p>${els(explain(e))}</p><button class="btn primary" onclick="location.reload()">Neu laden</button></section></main>`}}
  async function loadAdmin(){state.loading=true;render();try{if(!state.session?.access_token){state.adminReady=false;return}await ensureSession();const members=await request('/rest/v1/voting_admins?select=user_id&user_id=eq.'+encodeURIComponent(state.session.user?.id||''),{admin:true});if(!members?.length)throw Error('Dein Konto ist noch nicht als Merch-Team freigeschaltet. Bitte die Adminfreigabe aus der README-Anleitung ausführen.');state.adminReady=true;state.adminError='';await Promise.all([fetchAdminPoll(),fetchResults()])}catch(e){state.adminReady=false;state.adminError=explain(e);if(e.status===401){state.session=null;sessionSave()}}finally{state.loading=false;render()}}
  async function fetchAdminPoll(){const [ss,dd]=await Promise.all([request('/rest/v1/voting_settings?select=*&id=eq.true',{admin:true}),request('/rest/v1/design_options?select=*&order=question.asc,position.asc',{admin:true})]);if(!ss?.[0])throw Error('Die Datenbank ist noch nicht eingerichtet.');state.settings=ss[0];state.designs=dd||[]}
  async function fetchResults(){const all=[];for(let offset=0;;offset+=1000){const batch=await request('/rest/v1/ballots?select=basic_yes,pastoral_option,tree_option&order=created_at.asc,id.asc&limit=1000&offset='+offset,{admin:true})||[];all.push(...batch);if(batch.length<1000)break}state.ballots=all}
  async function submitBallot(){if(state.busy||state.basic===null||!state.hirte||!state.baum)return;state.busy=true;state.sendError='';render();try{const res=await request('/rest/v1/rpc/submit_ballot',{method:'POST',body:{p_id:state.ballot,p_basic_yes:state.basic,p_pastoral:state.hirte,p_tree:state.baum}});if(res!=='recorded'&&res!=='already_recorded')throw Error('Serverantwort unklar. Bitte erneut versuchen.');state.done=true}catch(e){state.sendError=explain(e)}finally{state.busy=false;render()}}
  async function toggle(){if(state.busy)return;const opening=!state.settings.is_open;state.busy=true;state.adminError='';state.notice='';render();try{await request('/rest/v1/voting_settings?id=eq.true',{method:'PATCH',admin:true,body:{is_open:opening}});await fetchAdminPoll();state.notice=opening?'Abstimmung geöffnet.':'Abstimmung geschlossen.'}catch(e){state.adminError=explain(e)}finally{state.busy=false;render()}}
  async function removeDesign(id){if(state.busy)return;const design=state.designs.find(d=>d.id===id);if(!design||state.settings.is_open||state.ballots.length)return;if(!confirm('Design „'+design.title+'“ wirklich entfernen?'))return;state.busy=true;state.adminError='';render();try{await request('/rest/v1/design_options?id=eq.'+encodeURIComponent(id),{method:'DELETE',admin:true});await fetchAdminPoll();state.notice='Design entfernt.'}catch(e){state.adminError=explain(e)}finally{state.busy=false;render()}}
  async function addDesign(form){if(state.busy)return;const q=Number(form.dataset.question);const fd=new FormData(form);const image=fd.get('image');const title=String(fd.get('title')||'').trim();const description=String(fd.get('description')||'').trim();if(!image||!(image instanceof File)||!image.size||!title){state.adminError='Bitte Bild und Titel auswählen.';render();return}if(!['image/png','image/jpeg','image/webp'].includes(image.type)||image.size>8*1024*1024){state.adminError='Bitte PNG, JPG oder WebP mit maximal 8 MB verwenden.';render();return}const position=[1,2,3].find(p=>!state.designs.some(d=>d.question===q&&d.position===p));if(!position||state.settings.is_open||state.ballots.length)return;state.busy=true;state.adminError='';render();const ext=image.type==='image/png'?'png':image.type==='image/webp'?'webp':'jpg';const path='q'+q+'/'+uuid()+'.'+ext;try{await request('/storage/v1/object/designs/'+path,{method:'POST',admin:true,body:image,contentType:image.type,headers:{'x-upsert':'false'}});await request('/rest/v1/design_options',{method:'POST',admin:true,body:{question:q,position,title,description,image_path:path}});await fetchAdminPoll();state.notice='Design gespeichert.'}catch(e){state.adminError=explain(e)+' Falls der Upload schon erfolgreich war, kann ein unbenutztes Bild im Storage verbleiben.'}finally{state.busy=false;render()}}
  function csv(){const {n,out}=calcResults();const safe=v=>{let s=String(v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const rows=[['Frage','Auswahl','Stimmen','Anteil in Prozent'],...out.flatMap(g=>g.rows.map(([name,count])=>[g.question,name,count,n?(count/n*100).toFixed(1):'0']))];const csv='\uFEFF'+rows.map(row=>row.map(safe).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='waldkirche-abstimmung-ergebnisse.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
  document.addEventListener('click',async ev=>{const node=ev.target.closest?.('[data-action]');if(!node||node.disabled)return;const action=node.dataset.action;try{if(action==='basic'){state.basic=node.dataset.value==='true';render()}else if(action==='choose'){if(state.step===1)state.hirte=node.dataset.id;else state.baum=node.dataset.id;render()}else if(action==='next'){if(state.step===2)await submitBallot();else{state.step++;render();window.scrollTo(0,0)}}else if(action==='back'){state.step=Math.max(0,state.step-1);state.sendError='';render();window.scrollTo(0,0)}else if(action==='retry'){await fetchPoll()}else if(action==='restart'){state.step=0;state.basic=null;state.hirte=null;state.baum=null;state.ballot=uuid();state.done=false;state.error='';state.sendError='';await fetchPoll()}else if(action==='go-vote'){location.hash='#/';state.route='vote';render()}else if(action==='logout'){state.session=null;state.adminReady=false;state.adminError='';sessionSave();render()}else if(action==='tab'){state.adminTab=node.dataset.value;state.adminError='';render()}else if(action==='toggle'){await toggle()}else if(action==='delete'){await removeDesign(node.dataset.id)}else if(action==='refresh-results'){state.busy=true;render();try{await fetchResults();state.notice='Ergebnisse aktualisiert.'}catch(e){state.adminError=explain(e)}finally{state.busy=false;render()}}else if(action==='csv'){csv()}}catch(e){state.adminError=explain(e);render()}});
  document.addEventListener('submit',async ev=>{if(ev.target.id==='loginForm'){ev.preventDefault();if(state.busy)return;const fd=new FormData(ev.target);state.busy=true;state.adminError='';render();try{const login=await request('/auth/v1/token?grant_type=password',{method:'POST',body:{email:String(fd.get('email')),password:String(fd.get('password'))}});state.session={...login,expires_at:Date.now()+login.expires_in*1000};sessionSave();await loadAdmin()}catch(e){state.adminError=explain(e);state.session=null;sessionSave()}finally{state.busy=false;render()}}else if(ev.target.matches('.upload-form')){ev.preventDefault();await addDesign(ev.target)}});
  window.addEventListener('hashchange',()=>{state.route=location.hash.startsWith('#/admin')?'admin':'vote';state.error='';if(state.route==='admin'){state.adminError='';void loadAdmin()}else{void fetchPoll()}});
  window.addEventListener('error',ev=>{if(!app.innerHTML.trim()){app.innerHTML='<div class="message-wrap"><section class="message"><h1>Die App konnte nicht geladen werden.</h1><p>Bitte öffne die Datei in Safari oder Chrome und versuche es erneut.</p></section></div>'}console.error('Waldkirche App:',ev.message)});
  sessionLoad();render();if(state.route==='admin')void loadAdmin();else void fetchPoll();
})();
</script>
</body>
